[project]
name = "fastapi-a-to-z"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.128.0",
    "flake8>=7.3.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.32",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
]


[tool.black]
line-length = 88          # 기본 권장 값 (팀 규칙에 맞춰 조정 가능)
target-version = ["py311"]
skip-string-normalization = false  # 문자열 따옴표 통일

[tool.isort]
profile = "black"         # black과 충돌 없이 import 정렬
line_length = 88
